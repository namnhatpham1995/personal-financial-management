spring:
  cache:
    type: redis
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

app:
  rate-limit:
    redis-enabled: true   # counters shared across replicas

logging:
  level:
    root: WARN
    com.fintrack: INFO

management:
  endpoint:
    health:
      show-details: never
